# Render blueprint: one free web service built from the Dockerfile in this repo.
# In Render: New > Blueprint > pick this repository > Apply. Every push to main redeploys.
services:
  - type: web
    name: canliskor
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The port the container listens on (the ASP.NET base image's default); Render routes traffic to it.
      - key: PORT
        value: "8080"
      # The secret the notification keys are derived from. Render makes it up once and keeps it, so browsers that
      # subscribed to notifications stay subscribed across deploys.
      - key: Push__Secret
        generateValue: true
      # The Postgres database that keeps the notification subscribers (postgresql://user:password@host/database).
      # A secret: its value is typed into Render's dashboard and never written here.
      - key: DATABASE_URL
        sync: false
      # The Firebase service-account key (the whole JSON file's text) the server sends the Android app's
      # notifications with. A secret, typed into the dashboard like the one above.
      - key: Firebase__ServiceAccount
        sync: false
